function validateSpec(value) {
  if(!value || value.version!==1 || value.units!=='mm') throw Error('Expected version 1, millimetre specification.');
  const base=JSON.parse(JSON.stringify(DEFAULT_SPEC));
  for(const group of ['board','leather','paper','binding','motion']) {
    if(!value[group] || typeof value[group]!=='object') throw Error('Missing '+group+' specification.');
    for(const [key,expected] of Object.entries(base[group])) {
      const actual=value[group][key];
      if(group==='binding'&&key==='neutralSpineLength'&&actual===undefined)continue;
      if(typeof expected==='number' && (!Number.isFinite(actual) || actual!==expected)) throw Error(group+'.'+key+' is fixed for this construction study.');
    }
  }
  if(typeof value.leather.colour!=='string' || !/^#[\da-f]{6}$/i.test(value.leather.colour)) throw Error('Invalid leather colour.');
  base.leather.colour=value.leather.colour;
  return base;
}
function thicknessBudget(spec=DEFAULT_SPEC) {
  const writing=spec.paper.leaves*spec.paper.thickness;
  const allowance=(spec.paper.leaves-1)*spec.paper.interleafAllowance;
  const endpapers=spec.binding.endpaperLeaves*spec.binding.endpaperThickness;
  const boards=spec.board.thickness*2, outerLeather=spec.leather.thickness*2;
  const pastedowns=spec.binding.pastedownThickness*2,endpaperClearance=.048;
  return {writing,allowance,endpapers,endpaperClearance,boards,outerLeather,pastedowns,body:writing+allowance+endpapers+endpaperClearance+boards+outerLeather+pastedowns,
    spineMaximum:writing+allowance+endpapers+endpaperClearance+boards+outerLeather+pastedowns+spec.binding.sewingSwell,
    note:'Turn-ins occupy perimeter recesses; hardware and curved spine projections are measured separately.'};
}

function makePose(spec,input={}) {
  if(!input||typeof input!=='object')throw Error('Pose must be an object.');
  for(const key of ['opening','leaf','turn','release'])if(input[key]!==undefined&&(typeof input[key]!=='number'||!Number.isFinite(input[key])))throw Error('Pose '+key+' must be a finite number.');
  const opening=clamp(Number.isFinite(input.opening)?input.opening:130,0,130);
  const leaf=Math.round(clamp(Number.isFinite(input.leaf)?input.leaf:104,1,spec.paper.leaves-2));
  const turn=opening<110?((input.turn||0)<.5?0:1):clamp(input.turn||0,0,1);
  const a=opening*Math.PI/180, tilt=25*Math.PI/180*smooth(opening/130);
  const pitch=(spec.paper.thickness+spec.paper.interleafAllowance)/1000;
  const total=pitch*spec.paper.leaves, split=(leaf+turn)/spec.paper.leaves;
  // The fixed-length spine needs room below the gutter, including near the first leaf.
  const y=.064+split*total*Math.cos(tilt)+.006;
  const gap=.0016*Math.sin(a/2);
  return {opening,leaf,turn,a,tilt,pitch,total,split,y,gap,release:opening>0?1:clamp(input.release??0,0,1)};
}

function leafFrame(spec,pose,index,progress=null) {
  const {leaf,turn,a,tilt,pitch,total,y,gap}=pose;
  const active=index===leaf, t=progress??(active?turn:index<leaf?0:1);
  const angle=tilt+a*t;
  const side=t<.5?0:1, top=leaf+turn;
  const offset=(index+.5-top)*pitch;
  const normal=[-Math.sin(angle),Math.cos(angle)];
  const shift=(.5-t)*gap;
  const root=[shift+offset*normal[0],y+offset*normal[1]];
  return {angle,root,normal,active,t,side,offset,total};
}

function leafSurface(spec,pose,index,quality='rest') {
  const f=leafFrame(spec,pose,index),width=spec.paper.width/1000,height=spec.paper.height/1000;

    const s=(i-.5)/steps;

const fract=x=>x-Math.floor(x);
const hash=(x,y)=>fract(Math.sin(x*127.1+y*311.7)*43758.5453123);
